name: 4. Build MFS
run-name: Build MFS (${{ github.ref_name }})
on:
  workflow_dispatch:

# Manual only. No upstream sync and no scheduled builds: a build uses exactly
# the dependency versions pinned in Package.resolved and Gemfile.lock.

jobs:
  build:
    name: Build and upload to TestFlight
    runs-on: macos-15
    permissions:
      contents: read
    env:
      TEAMID: ${{ secrets.TEAMID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
      FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
      FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Apply submodule patches
        run: ./scripts/apply_patches.sh

      - name: Select Xcode version
        run: |
          sudo xcode-select --switch /Applications/Xcode_${{ vars.XCODE_VERSION || '26.3' }}.app/Contents/Developer
          xcodebuild -version
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          if [ "${sdk_version%%.*}" -lt 26 ]; then
            echo "::error::App Store Connect requires the iOS 26 SDK or newer; selected SDK is $sdk_version."
            exit 1
          fi

      - name: Install Ruby gems
        run: bundle install

      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Test IPA framework check
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_check_ipa_frameworks.py'

      - name: Test IPA Bluetooth configuration check
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_check_ipa_bluetooth.py'

      - name: Fastlane build and archive
        run: bundle exec fastlane build_mfs

      - name: Check packaged framework dependencies
        run: python3 scripts/check_ipa_frameworks.py MFS.ipa

      - name: Check packaged Bluetooth configuration
        run: python3 scripts/check_ipa_bluetooth.py MFS.ipa

      - name: Fastlane upload to TestFlight
        run: bundle exec fastlane release

      - name: Upload build log, IPA and symbol artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            artifacts
            buildlog
