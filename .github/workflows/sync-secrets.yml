name: Sync org secrets to external repo

# Place in a repository inside T1MFS that can access the org secrets.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target repo (owner/name)"
        required: true
        default: fx2-t1d/MFS_DEV

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: secret-sync # add required reviewers to this environment
    steps:
      - name: Copy secrets
        env:
          # PAT (fine-grained) owned by fx2-t1d with "Secrets: read/write" on the target repo only
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
          TARGET: ${{ inputs.target }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          TEAMID: ${{ secrets.TEAMID }}
        run: |
          for name in FASTLANE_ISSUER_ID FASTLANE_KEY FASTLANE_KEY_ID GH_PAT MATCH_PASSWORD TEAMID; do
            printf '%s' "${!name}" | gh secret set "$name" -R "$TARGET"
          done
