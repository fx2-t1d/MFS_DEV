name: Test
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.select.outputs.runner }}
    steps:
      - name: Select an available runner
        id: select
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          TRUSTED_RUN: ${{ github.actor == github.repository_owner && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository)) }}
        run: |
          runner='["macos-15"]'
          if [[ "$TRUSTED_RUN" != "true" ]]; then
            echo "Using GitHub-hosted runner for an untrusted pull request or actor."
          elif [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::RUNNER_STATUS_TOKEN is not configured; using GitHub-hosted runner."
          elif ! available=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runners?per_page=100" \
            --jq 'any(.[]; any(.runners[]; .status == "online" and (.busy | not) and ([.labels[].name | ascii_downcase] | (index("self-hosted") != null and index("macos") != null and index("arm64") != null))))'); then
            echo "::warning::Could not check self-hosted runners; using GitHub-hosted runner."
          elif [[ "$available" == "true" ]]; then
            runner='["self-hosted","macOS","ARM64"]'
          fi
          echo "Selected runner: $runner"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  test:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Apply submodule patches
        run: ./scripts/apply_patches.sh
      - name: Select Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_${{ vars.XCODE_VERSION || '16.4' }}.app/Contents/Developer
      - run: ruby scripts/test_update_dependencies.rb
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_scan_dependency_updates.py'
      - name: Check out biometric spec
        uses: actions/checkout@v5
        with:
          repository: fx2-t1d/TidepoolApi_extended
          # Switch to master once TidepoolApi_extended PR #1 is merged.
          ref: master
          path: spec
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install pyyaml
      - run: SPEC_DIR="$GITHUB_WORKSPACE/spec" PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s scripts -p 'test_biometric_spec_conformance.py'
      - run: bundle install
      - run: ./scripts/check_no_delivery_commands.sh
      - run: ./scripts/check_no_remote_control.sh
      - run: bundle exec fastlane test
